<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpo em Movimento</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <main>
        <form action="">
        <label for="userName">Nome:</label>
        <input type="text" id="userName" name="userName" required><br>
        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" name="userEmail" required><br>
        <label for="userPhone">Telefone: </label>
        <input type="text" id="userPhone" name="userPhone"><br>
        <p>Assunto: </p>
        <select>
            <option value="Plano">Plano</option>
            <option value="Horários">Horários</option>
            <option value="Aula Experimental">Aula Experimental</option>
            <option value="Outros">Outros</option>
        </select><br><br>
        <label for="userMessage">Mensagem:</label><br>
        <textarea></textarea><br>
        </form>
    </main>
</body>
</html>
